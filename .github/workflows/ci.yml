name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'build.sh'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'build.sh'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-binaries:
    uses: ./.github/workflows/build-binaries.yml

  run-tests:
    needs: build-binaries
    uses: ./.github/workflows/run-tests.yml
    with:
      artifact_name: binaries-${{ github.sha }}

  # Builds the app with the Dear ImGui Test Engine and runs the GUI tests on
  # Mesa llvmpipe (no GPU on the runner). Independent of build-binaries: the
  # job builds everything itself, so it runs in parallel with run-tests.
  gui-tests:
    uses: ./.github/workflows/gui-tests.yml
