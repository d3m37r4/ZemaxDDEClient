name: Build & Attach Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-binaries:
    uses: ./.github/workflows/test/build-binaries.yml

  vt-scan:
    needs: build-binaries
    uses: ./.github/workflows/test/vt-scan-binaries.yml
    with:
      artifact_name: binaries-${{ github.sha }}
    secrets:
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

  package:
    needs: vt-scan
    uses: ./.github/workflows/test/package-release.yml
    with:
      release_id: ${{ github.event.release.id }}
      tag_name: ${{ github.event.release.tag_name }}
      artifact_name: binaries-${{ github.sha }}
      vt_artifact_name: vt-result
