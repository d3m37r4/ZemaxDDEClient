name: CD Runners Smoke Test

on:
  push:
    branches:
      - test/cd-jobs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    uses: ./.github/workflows/build-binaries.yml

  vt-scan:
    needs: build-binaries
    uses: ./.github/workflows/vt-scan-binaries.yml
    with:
      artifact_name: binaries-${{ github.sha }}
    secrets:
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

  package:
    needs: vt-scan
    uses: ./.github/workflows/package-release.yml
    with:
      release_id: "378948254"
      tag_name: "test/v0.8.0b-scan"
      artifact_name: binaries-${{ github.sha }}
      vt_artifact_name: vt-result
